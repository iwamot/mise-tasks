min_version = "2026.10.25"

[settings]
experimental = true
lockfile = true
minimum_release_age = "1d"

[tool_config]
locked = true

# Declare self-validation tools here as well as in the distributed task headers.
# mise 2026.10.19 otherwise prunes task-only lock entries in a mise-tasks checkout.
[tools]
"aqua:aubepkg/aube" = "2.10.0"
node = "26.13.1"
"aqua:hadolint/hadolint" = "2.15.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.14.1"
"aqua:suzuki-shunsuke/ghalint" = "1.6.0"
"aqua:suzuki-shunsuke/pinact" = "5.0.2"
"aqua:zizmorcore/zizmor" = "1.32.0"
"gh" = "2.104.0"
"github:github/gh-actions-lock" = { version = "v0.4.1", bin = "gh-actions-lock" }
"github:iwamot/gitignore-prune" = "v1.0.3"
"github:jdx/jactionlint" = "v2.6.0"
