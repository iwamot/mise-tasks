min_version = "2026.10.19"

[settings]
experimental = true
lockfile = true
minimum_release_age = "1d"

# Declare self-validation tools here as well as in the distributed task headers.
# mise 2026.10.19 otherwise prunes task-only lock entries in a mise-tasks checkout.
[tools]
"aqua:hadolint/hadolint" = "2.15.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.14.1"
"aqua:suzuki-shunsuke/ghalint" = "1.5.7"
"aqua:suzuki-shunsuke/pinact" = "5.0.2"
"aqua:zizmorcore/zizmor" = "1.31.1"
"gh" = "2.103.3"
"github:github/gh-actions-lock" = { version = "0.4.0", bin = "gh-actions-lock" }
"github:iwamot/gitignore-prune" = "v1.0.3"
"github:jdx/jactionlint" = "v2.4.0"
